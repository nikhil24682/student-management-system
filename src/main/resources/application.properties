spring.application.name=StudentManagementSystem

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_management_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Existing non-empty databases are baselined at the initial schema version.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Thymeleaf
spring.thymeleaf.cache=false
