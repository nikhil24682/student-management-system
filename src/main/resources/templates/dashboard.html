<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.sidebar{
    width:250px;
    height:100vh;
    position:fixed;
    background:#0d6efd;
    color:white;
    padding-top:20px;
}

.sidebar h3{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
    font-size:17px;
}

.sidebar a:hover{
    background:#0b5ed7;
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0px 4px 12px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="sidebar">

    <h3>SMS Admin</h3>

    <a th:href="@{/dashboard}">Dashboard</a>

    <a th:href="@{/students}">Students</a>

    <a th:href="@{/students/add}">Add Student</a>

    <form th:action="@{/logout}" method="post" class="px-3 mt-3">
        <button class="btn btn-light w-100">
            Logout
        </button>
    </form>

</div>

<div class="content">

    <h2>Dashboard</h2>

    <p class="text-muted">
        Welcome to Student Management System
    </p>

	<div class="row mt-4">

	    <div class="col-md-4">
	        <div class="card p-4 text-center">
	            <h5>Total Students</h5>
	            <h2 th:text="${totalStudents}">0</h2>
	        </div>
	    </div>

	    <div class="col-md-4">
	        <div class="card p-4 text-center">
	            <h5>Active Students</h5>
	            <h2 class="text-success" th:text="${activeStudents}">0</h2>
	        </div>
	    </div>

	    <div class="col-md-4">
	        <div class="card p-4 text-center">
	            <h5>Inactive Students</h5>
	            <h2 class="text-danger" th:text="${inactiveStudents}">0</h2>
	        </div>
	    </div>

	</div>

</div>

</body>
</html>
