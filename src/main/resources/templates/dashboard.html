<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head('Dashboard')}"/>
</head>
<body>
<div class="app-shell">

  <th:block th:replace="~{fragments/layout :: shell('dashboard')}"/>

  <main class="main-content" id="main-content" tabindex="-1">

    <div class="page-header">
      <h1>Dashboard</h1>
      <p>Welcome to the Student Management System</p>
    </div>

    <div class="row g-3">

      <div class="col-12 col-md-4">
        <div class="stat-card stat-total">
          <div class="stat-icon" aria-hidden="true">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5-3.87M9 20H4v-2a4 4 0 015-3.87m6-4.13a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </div>
          <div class="stat-label">Total Students</div>
          <p class="stat-value" th:text="${totalStudents}">0</p>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="stat-card stat-active">
          <div class="stat-icon" aria-hidden="true">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div class="stat-label">Active Students</div>
          <p class="stat-value" th:text="${activeStudents}">0</p>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="stat-card stat-inactive">
          <div class="stat-icon" aria-hidden="true">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div class="stat-label">Inactive Students</div>
          <p class="stat-value" th:text="${inactiveStudents}">0</p>
        </div>
      </div>

    </div>

  </main>
</div>
</body>
</html>
