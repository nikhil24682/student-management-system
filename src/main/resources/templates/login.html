<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-theme-row">
      <button id="themeToggle" class="theme-toggle-login" type="button">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-sun">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 1.78a1 1 0 011.42 1.42l-.71.7a1 1 0 11-1.41-1.41l.7-.71zM18 9a1 1 0 110 2h-1a1 1 0 110-2h1zM4.22 16.22a1 1 0 001.42 0l.7-.71a1 1 0 10-1.41-1.41l-.71.7a1 1 0 000 1.42zM3 10a1 1 0 100 2H2a1 1 0 100-2h1zm2.05-5.95a1 1 0 00-1.41 1.41l.7.71a1 1 0 001.42-1.42l-.71-.7zM10 15a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm5.66.66a1 1 0 001.41-1.41l-.7-.71a1 1 0 10-1.42 1.42l.71.7zM10 6a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-moon">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
        <span class="theme-label">Dark</span>
      </button>
    </div>

    <div class="login-logo">
      <svg width="28" height="28" fill="none" stroke="#0d6efd" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422A12.083 12.083 0 0112 21.5a12.083 12.083 0 01-6.16-10.922L12 14z"/>
      </svg>
      <span>Student Management System</span>
    </div>

    <form th:action="@{/login}" method="post">

      <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
        Invalid username or password.
      </div>
      <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
        You have been logged out.
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" name="username"
               class="form-control"
               autocomplete="username"
               autofocus>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" name="password"
               class="form-control"
               autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary w-100">Sign in</button>

    </form>
  </div>
</div>

</body>
</html>
