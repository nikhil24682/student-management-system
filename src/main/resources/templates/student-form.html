<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.container{
    max-width:700px;
    margin-top:40px;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="mb-4 text-primary">Add Student</h2>

<form th:action="@{/students/save}" th:object="${student}" method="post">
	
	<input type="hidden" th:field="*{id}">

	<div class="mb-3">
	    <label>Name</label>

	    <input type="text"
	           th:field="*{name}"
	           class="form-control">

	    <div class="text-danger"
	         th:if="${#fields.hasErrors('name')}"
	         th:errors="*{name}">
	    </div>
	</div>

	<div class="mb-3">
	    <label>Email</label>

	    <input type="email"
	           th:field="*{email}"
	           class="form-control">

	    <div class="text-danger"
	         th:if="${#fields.hasErrors('email')}"
	         th:errors="*{email}">
	    </div>
	</div>

	<div class="mb-3">
	    <label>Phone</label>

	    <input type="text"
	           th:field="*{phone}"
	           class="form-control">

	    <div class="text-danger"
	         th:if="${#fields.hasErrors('phone')}"
	         th:errors="*{phone}">
	    </div>
	</div>

	<div class="mb-3">
	    <label>Gender</label>

	    <select th:field="*{gender}" class="form-control">
	        <option value="">Select Gender</option>
	        <option value="Male">Male</option>
	        <option value="Female">Female</option>
	    </select>

	    <div class="text-danger"
	         th:if="${#fields.hasErrors('gender')}"
	         th:errors="*{gender}">
	    </div>
	</div>

<div class="mb-3">
    <label>Course</label>

    <input type="text"
           th:field="*{course}"
           class="form-control">

    <div class="text-danger"
         th:if="${#fields.hasErrors('course')}"
         th:errors="*{course}">
    </div>
</div>

<div class="mb-3">
    <label>Address</label>

    <input type="text"
           th:field="*{address}"
           class="form-control">

    <div class="text-danger"
         th:if="${#fields.hasErrors('address')}"
         th:errors="*{address}">
    </div>
</div>

<div class="mb-3">
    <label>Date of Birth</label>

    <input type="date"
           th:field="*{dateOfBirth}"
           class="form-control">

    <div class="text-danger"
         th:if="${#fields.hasErrors('dateOfBirth')}"
         th:errors="*{dateOfBirth}">
    </div>
</div>

<div class="mb-3">
    <label>Admission Date</label>

    <input type="date"
           th:field="*{admissionDate}"
           class="form-control">

    <div class="text-danger"
         th:if="${#fields.hasErrors('admissionDate')}"
         th:errors="*{admissionDate}">
    </div>
</div>

<div class="mb-3">
    <label>Status</label>

    <select th:field="*{status}" class="form-control">
        <option value="">Select Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select>

    <div class="text-danger"
         th:if="${#fields.hasErrors('status')}"
         th:errors="*{status}">
    </div>
</div>

<button class="btn btn-primary">Save Student</button>

<a th:href="@{/students}" class="btn btn-secondary">Back</a>

</form>

</div>

</div>

</body>
</html>
