<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Error</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f8f9fa;
}
.error-container{
    max-width:600px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
    text-align:center;
}
</style>

</head>
<body>

<div class="error-container">

    <h2 class="text-danger">Oops! Something went wrong.</h2>

    <p class="mt-3" th:text="${errorMessage}"></p>

    <a href="/students" class="btn btn-primary mt-3">
        Back to Students
    </a>

</div>

</body>
</html>
