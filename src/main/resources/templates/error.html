<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error – SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<div class="error-page">
  <div class="error-card">

    <svg class="error-icon" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    </svg>

    <h1 class="error-title">
      Something went wrong
    </h1>

    <p class="text-muted mb-4" th:text="${errorMessage}">An unexpected error occurred.</p>

    <a th:href="@{/students}" class="btn btn-primary">Back to Students</a>

  </div>
</div>

</body>
</html>
