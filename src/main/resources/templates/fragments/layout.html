<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--/* ── <head> fragment ─────────────────────────────────────── */-->
<th:block th:fragment="head(pageTitle)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${pageTitle} + ' – SMS'">SMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/app.css}" rel="stylesheet">
<script th:src="@{/js/app.js}" defer></script>
</th:block>

<!--/* ── Authenticated shell fragment ────────────────────────── */-->
<th:block th:fragment="shell(activePage)">

<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- Desktop topbar -->
<header class="desktop-topbar" id="desktopTopbar">
  <button class="btn-menu" id="desktopMenuBtn" type="button" aria-label="Toggle sidebar" aria-expanded="true" aria-controls="sidebar">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <span class="desktop-topbar-title">Student Management System</span>
  <button class="theme-toggle theme-toggle-top" id="themeToggleTop" type="button">
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-sun">
      <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 1.78a1 1 0 011.42 1.42l-.71.7a1 1 0 11-1.41-1.41l.7-.71zM18 9a1 1 0 110 2h-1a1 1 0 110-2h1zM4.22 16.22a1 1 0 001.42 0l.7-.71a1 1 0 10-1.41-1.41l-.71.7a1 1 0 000 1.42zM3 10a1 1 0 100 2H2a1 1 0 100-2h1zm2.05-5.95a1 1 0 00-1.41 1.41l.7.71a1 1 0 001.42-1.42l-.71-.7zM10 15a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm5.66.66a1 1 0 001.41-1.41l-.7-.71a1 1 0 10-1.42 1.42l.71.7zM10 6a4 4 0 100 8 4 4 0 000-8z"/>
    </svg>
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-moon">
      <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
    </svg>
    <span class="theme-label">Dark</span>
  </button>
</header>

<!-- Mobile topbar -->
<header class="topbar" role="banner">
  <button class="btn-menu" id="menuBtn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <span class="topbar-title">SMS Admin</span>
  <button class="theme-toggle" id="themeToggleMobile" type="button">
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-sun">
      <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 1.78a1 1 0 011.42 1.42l-.71.7a1 1 0 11-1.41-1.41l.7-.71zM18 9a1 1 0 110 2h-1a1 1 0 110-2h1zM4.22 16.22a1 1 0 001.42 0l.7-.71a1 1 0 10-1.41-1.41l-.71.7a1 1 0 000 1.42zM3 10a1 1 0 100 2H2a1 1 0 100-2h1zm2.05-5.95a1 1 0 00-1.41 1.41l.7.71a1 1 0 001.42-1.42l-.71-.7zM10 15a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm5.66.66a1 1 0 001.41-1.41l-.7-.71a1 1 0 10-1.42 1.42l.71.7zM10 6a4 4 0 100 8 4 4 0 000-8z"/>
    </svg>
    <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-moon">
      <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
    </svg>
    <span class="theme-label">Dark</span>
  </button>
</header>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar" aria-label="Main navigation" aria-hidden="false">
  <a th:href="@{/dashboard}" class="sidebar-brand">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422A12.083 12.083 0 0112 21.5a12.083 12.083 0 01-6.16-10.922L12 14z"/>
    </svg>
    SMS Admin
  </a>

  <div class="sidebar-nav">
    <a th:href="@{/dashboard}"
       th:classappend="${activePage == 'dashboard'} ? ' active'"
       th:attr="aria-current=${activePage == 'dashboard'} ? 'page' : null">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </a>
    <a th:href="@{/students}"
       th:classappend="${activePage == 'students'} ? ' active'"
       th:attr="aria-current=${activePage == 'students'} ? 'page' : null">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5-3.87M9 20H4v-2a4 4 0 015-3.87m6-4.13a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      Students
    </a>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/students/add}"
       th:classappend="${activePage == 'add-student'} ? ' active'"
       th:attr="aria-current=${activePage == 'add-student'} ? 'page' : null">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      Add Student
    </a>
  </div>

  <div class="sidebar-footer">
    <button class="theme-toggle theme-toggle-side mb-3" id="themeToggleSide" type="button">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-sun">
        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 1.78a1 1 0 011.42 1.42l-.71.7a1 1 0 11-1.41-1.41l.7-.71zM18 9a1 1 0 110 2h-1a1 1 0 110-2h1zM4.22 16.22a1 1 0 001.42 0l.7-.71a1 1 0 10-1.41-1.41l-.71.7a1 1 0 000 1.42zM3 10a1 1 0 100 2H2a1 1 0 100-2h1zm2.05-5.95a1 1 0 00-1.41 1.41l.7.71a1 1 0 001.42-1.42l-.71-.7zM10 15a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm5.66.66a1 1 0 001.41-1.41l-.7-.71a1 1 0 10-1.42 1.42l.71.7zM10 6a4 4 0 100 8 4 4 0 000-8z"/>
      </svg>
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" class="icon-moon">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
      </svg>
      <span class="theme-label">Dark mode</span>
    </button>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn-logout" aria-label="Log out">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
        </svg>
        Logout
      </button>
    </form>
  </div>
</nav>

</th:block>

</html>
