<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/layout :: head('Students')}"/>
</head>
<body>
<div class="app-shell">

  <th:block th:replace="~{fragments/layout :: shell('students')}"/>

  <main class="main-content" id="main-content" tabindex="-1">

    <div class="page-header">
      <h1>Students</h1>
    </div>

    <div class="table-card">

      <div class="table-toolbar">
        <h2>Student List</h2>
        <form th:action="@{/students/search}" method="get" class="search-form" role="search">
          <label for="searchInput" class="visually-hidden">Search by name</label>
          <input id="searchInput"
                 type="search"
                 name="name"
                 class="form-control form-control-sm"
                 placeholder="Search by name…">
          <button type="submit" class="btn btn-primary btn-sm">Search</button>
        </form>
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/students/add}" class="btn btn-success btn-sm">+ Add Student</a>
      </div>

      <div class="table-responsive">
        <table class="table" aria-label="Student list">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Phone</th>
              <th scope="col">Course</th>
              <th scope="col">Status</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(students)}">
              <td colspan="7">
                <div class="empty-state">
                  <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5-3.87M9 20H4v-2a4 4 0 015-3.87m6-4.13a4 4 0 11-8 0 4 4 0 018 0z"/>
                  </svg>
                  <p class="mb-0">No students found.</p>
                </div>
              </td>
            </tr>
            <tr th:each="student : ${students}">
              <td th:text="${student.id}"></td>
              <td th:text="${student.name}"></td>
              <td th:text="${student.email}"></td>
              <td th:text="${student.phone}"></td>
              <td th:text="${student.course}"></td>
              <td>
                <span th:if="${student.status == 'Active'}"   class="badge-status badge-active">Active</span>
                <span th:if="${student.status == 'Inactive'}" class="badge-status badge-inactive">Inactive</span>
                <span th:if="${student.status != 'Active' and student.status != 'Inactive'}"
                      class="badge-status" th:text="${student.status}"></span>
              </td>
              <td>
                <th:block sec:authorize="hasRole('ADMIN')">
                  <a th:href="@{/students/edit/{id}(id=${student.id})}"
                     class="btn btn-warning btn-sm">Edit</a>
                  <form th:action="@{/students/delete/{id}(id=${student.id})}"
                        method="post" class="d-inline"
                        data-confirm="Delete this student?">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                  </form>
                </th:block>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${totalPages > 1}" class="px-3 pb-3">
        <nav aria-label="Student list pagination">
          <ul class="pagination justify-content-center mb-0">

            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a th:if="${currentPage > 0}" class="page-link" th:href="@{/students(page=${currentPage - 1})}" aria-label="Previous page">
                <span aria-hidden="true">&laquo;</span>
              </a>
              <span th:if="${currentPage == 0}" class="page-link" aria-disabled="true">
                <span aria-hidden="true">&laquo;</span><span class="visually-hidden">Previous page</span>
              </span>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
              <a class="page-link"
                 th:text="${i + 1}"
                 th:attr="aria-label=${'Page ' + (i + 1)}, aria-current=${i == currentPage} ? 'page' : null"
                 th:href="@{/students(page=${i})}"></a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
              <a th:if="${currentPage < totalPages - 1}" class="page-link" th:href="@{/students(page=${currentPage + 1})}" aria-label="Next page">
                <span aria-hidden="true">&raquo;</span>
              </a>
              <span th:if="${currentPage == totalPages - 1}" class="page-link" aria-disabled="true">
                <span aria-hidden="true">&raquo;</span><span class="visually-hidden">Next page</span>
              </span>
            </li>

          </ul>
        </nav>
      </div>

    </div>

  </main>
</div>
</body>
</html>
