<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.sidebar{
    width:250px;
    height:100vh;
    position:fixed;
    background:#0d6efd;
    color:white;
    padding-top:20px;
}

.sidebar h3{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
}

.sidebar a:hover{
    background:#0b5ed7;
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<div class="sidebar">

    <h3>SMS Admin</h3>

    <a th:href="@{/dashboard}">Dashboard</a>

    <a th:href="@{/students}">Students</a>

   <a th:href="@{/students/add}">Add Student</a>

    <form th:action="@{/logout}" method="post" class="px-3 mt-4">
        <button class="btn btn-light w-100">
            Logout
        </button>
    </form>

</div>

<div class="content">

<div class="card p-4">



<div class="d-flex justify-content-between mb-3">

    <h3 class="text-primary">Student List</h3>

    <form th:action="@{/students/search}" method="get" class="d-flex">

        <input type="text"
               name="name"
               class="form-control me-2"
               placeholder="Search by Name">

        <button class="btn btn-primary">
            Search
        </button>

    </form>

</div>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Course</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="student : ${students}">

<td th:text="${student.id}"></td>

<td th:text="${student.name}"></td>

<td th:text="${student.email}"></td>

<td th:text="${student.phone}"></td>

<td th:text="${student.course}"></td>

<td>
    <a th:href="@{/students/edit/{id}(id=${student.id})}"
       class="btn btn-warning btn-sm">
        Edit
    </a>

    <a th:href="@{/students/delete/{id}(id=${student.id})}"
       class="btn btn-danger btn-sm"
       onclick="return confirm('Are you sure you want to delete this student?');">
        Delete
    </a>
</td>

</tr>

</tbody>

</table>

<nav class="mt-3">
    <ul class="pagination justify-content-center">

        <!-- Previous Button -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/students(page=${currentPage-1})}">
                Previous
            </a>
        </li>

        <!-- Page Numbers -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, totalPages-1)}"
            th:classappend="${i == currentPage} ? 'active'">

            <a class="page-link"
               th:text="${i+1}"
               th:href="@{/students(page=${i})}">
            </a>

        </li>

        <!-- Next Button -->
        <li class="page-item"
            th:classappend="${currentPage == totalPages-1} ? 'disabled'">

            <a class="page-link"
               th:href="@{/students(page=${currentPage+1})}">
                Next
            </a>

        </li>

    </ul>
</nav>

</div>

</div>

</body>
</html>
