name: student-management-system

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management_system}
      MYSQL_USER: ${MYSQL_USER:-sms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-student_management_system}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-sms_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-sms_password}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
